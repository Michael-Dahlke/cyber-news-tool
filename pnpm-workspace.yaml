# Supply-chain cooldown: refuse to resolve package versions published less
# than 7 days ago (value in minutes). Matches the Dependabot cooldown.
minimumReleaseAge: 10080

# Audit exceptions. Each entry needs a reason and a revisit condition.
auditConfig:
  ignoreGhsas:
    # postcss-selector-parser <7.1.6: quadratic parsing of crafted selectors
    # (CPU exhaustion). Pulled in only by @tailwindcss/typography 0.5.20, which
    # pins 6.0.10 exactly; the fix exists only in 7.x. Build-time only, and it
    # parses this repo's own CSS, so there is no attacker-controlled input.
    # Remove once @tailwindcss/typography ships with postcss-selector-parser >=7.1.6.
    - GHSA-rj75-hqrm-r3gf
